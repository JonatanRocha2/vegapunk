name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  DISABLE_TELEMETRY: "1"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  # renovate: datasource=npm depName=skills
  SKILLS_CLI_VERSION: "1.5.23"
  # renovate: datasource=github-digest depName=aws/agent-toolkit-for-aws
  AWS_TOOLKIT_REF: "main"
  AWS_TOOLKIT_COMMIT: "ed19c44c46c9c3a12ef0ff5bbf88161b75d3efbe"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Validate skill structure
        run: npm test

      - name: Validate shell installer syntax
        run: sh -n install.sh

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "./install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Verify Agent Skills discovery
        run: npx --yes "skills@$SKILLS_CLI_VERSION" add . --list

      - name: Verify official AWS skills discovery
        run: >-
          npx --yes "skills@$SKILLS_CLI_VERSION" add
          "https://github.com/aws/agent-toolkit-for-aws/tree/$AWS_TOOLKIT_COMMIT/skills/core-skills"
          --list
