name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  DISABLE_TELEMETRY: "1"
  NPM_CONFIG_IGNORE_SCRIPTS: "true"
  # renovate: datasource=npm depName=skills
  SKILLS_CLI_VERSION: "1.5.23"
  # renovate: datasource=github-digest depName=aws/agent-toolkit-for-aws
  AWS_TOOLKIT_REF: "main"
  AWS_TOOLKIT_COMMIT: "ed19c44c46c9c3a12ef0ff5bbf88161b75d3efbe"
  # renovate: datasource=github-releases depName=JuliusBrussee/caveman
  CAVEMAN_VERSION: "v2.3.1"
  CAVEMAN_COMMIT: "b5ec6351396b643a17cbbec4a6eee8b3fb9dd782"
  # renovate: datasource=github-digest depName=mattpocock/skills
  HANDOFF_REF: "main"
  HANDOFF_COMMIT: "6654f6b60cd9d5be8b54c6fafe44346dabeb3b76"
  # renovate: datasource=github-digest depName=anthropics/skills
  FRONTEND_DESIGN_REF: "main"
  FRONTEND_DESIGN_COMMIT: "3b3fad96af16a10759d930941b4520ba0c40edae"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0

      - name: Validate skill structure
        run: npm test

      - name: Validate shell installer syntax
        run: sh -n install.sh

      - name: Verify piped shell installer completion
        run: sh scripts/test-install-pipe.sh

      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "./install.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Verify Agent Skills discovery
        run: npx --yes "skills@$SKILLS_CLI_VERSION" add . --list

      - name: Verify official AWS skills discovery
        run: |
          aws_toolkit_temp=$(mktemp -d)
          trap 'rm -rf "$aws_toolkit_temp"' EXIT
          git init --quiet "$aws_toolkit_temp"
          git -C "$aws_toolkit_temp" fetch --quiet --depth 1 \
            https://github.com/aws/agent-toolkit-for-aws.git "$AWS_TOOLKIT_COMMIT"
          git -C "$aws_toolkit_temp" sparse-checkout init --cone
          git -C "$aws_toolkit_temp" sparse-checkout set skills/core-skills
          git -C "$aws_toolkit_temp" checkout --quiet --detach FETCH_HEAD
          npx --yes "skills@$SKILLS_CLI_VERSION" add \
            "$aws_toolkit_temp/skills/core-skills" --list

      - name: Verify Caveman skill discovery
        run: |
          caveman_temp=$(mktemp -d)
          trap 'rm -rf "$caveman_temp"' EXIT
          git init --quiet "$caveman_temp"
          git -C "$caveman_temp" fetch --quiet --depth 1 \
            https://github.com/JuliusBrussee/caveman.git "$CAVEMAN_COMMIT"
          git -C "$caveman_temp" checkout --quiet --detach FETCH_HEAD
          npx --yes "skills@$SKILLS_CLI_VERSION" add "$caveman_temp" \
            --skill caveman --list

      - name: Verify recommended skill discovery
        run: |
          verify_skill() {
            repository=$1
            commit=$2
            skill=$3
            skill_temp=$(mktemp -d)
            git init --quiet "$skill_temp"
            git -C "$skill_temp" fetch --quiet --depth 1 "$repository" "$commit"
            git -C "$skill_temp" checkout --quiet --detach FETCH_HEAD
            npx --yes "skills@$SKILLS_CLI_VERSION" add "$skill_temp" \
              --skill "$skill" --list
            rm -rf "$skill_temp"
          }
          verify_skill https://github.com/mattpocock/skills.git \
            "$HANDOFF_COMMIT" handoff
          verify_skill https://github.com/anthropics/skills.git \
            "$FRONTEND_DESIGN_COMMIT" frontend-design
